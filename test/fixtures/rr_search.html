<!DOCTYPE html>
<html lang="en">
<head><title>Fiction Search : StoryReader Fixture</title></head>
<body>
<div class="page-content-inner">

                <span class="tags">

          </div>

            <figure class="col-sm-2 col-md-3 col-lg-2 text-center">

            </figure>
            <div class="col-sm-10 col-md-8 col-lg-9 col-xs-12 search-content">

                <a href="/fiction/222/beta-two" class="font-red-sunglo bold">Beta Two</a>
              </h2>
              <div class="margin-bottom-10">
                <span class="tags">
                  <a class="label label-default label-sm bg-blue-dark fiction-tag" href="/fictions/search?tagsAdd=mystery">Mystery</a>
                </span>
              </div>
            </div>
          </div>
        </div>
        <nav class="pagination-container"><ul class="pagination"><li><a href="/fictions/search?title=alpha&amp;page=2">2</a></li></ul></nav>

    <div class="col-md-4"><div class="portlet light">sidebar omitted</div></div>
